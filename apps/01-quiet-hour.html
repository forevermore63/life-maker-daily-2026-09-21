<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Quiet Hour Vault</title><style>body{font-family:Georgia,serif;background:#101c16;color:#f4efe4;margin:0;padding:28px;max-width:680px}a,button{color:#1a1408;background:#e8c97a;padding:10px 16px;border-radius:999px;text-decoration:none;border:0;font:inherit}textarea,input{width:100%;padding:10px;border-radius:8px;border:1px solid #2d4638;background:#16241c;color:#f4efe4}</style></head><body><p><a href="../monitor.html">Monitor</a></p><h1>Quiet Hour Vault</h1><p>Protect one hour. No extraction. Optional PayID gift keeps the pool alive so more hours can be protected.</p><label>Hour you are protecting</label><input id="h" placeholder="Tuesday dusk walk"><label>Note to self</label><textarea id="n" rows="4" placeholder="Phones down. Dogs first."></textarea><p><button type="button" onclick="localStorage.setItem('qh',JSON.stringify({h:h.value,n:n.value}));alert('Hour sealed on this device.')">Seal the hour</button></p><p>Gift path: use your PayID outside this page. This engine only holds the intention.</p></body></html>
