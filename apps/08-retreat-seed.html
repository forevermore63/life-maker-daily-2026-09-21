<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Retreat Seed Map</title><style>body{font-family:Georgia,serif;background:#101c16;color:#f4efe4;padding:28px}input,button{padding:10px}a{color:#e8c97a}</style></head><body><p><a href="../monitor.html">Monitor</a></p><h1>Retreat Seed Map</h1><p>QLD hinterland and NSW South Coast stillness. Collect interest only — no fake bookings.</p><input id="who" placeholder="Name or handle"><input id="where" placeholder="Coast or hinterland"><button onclick="const x=JSON.parse(localStorage.getItem('rs')||'[]');x.push({who:who.value,where:where.value});localStorage.setItem('rs',JSON.stringify(x));alert('Seed saved on this device.')">Save interest</button></body></html>
