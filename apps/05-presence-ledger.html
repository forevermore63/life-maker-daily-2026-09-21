<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Presence Ledger</title><style>body{font-family:Georgia,serif;background:#101c16;color:#f4efe4;padding:28px}a{color:#e8c97a}input{padding:8px}ul{padding-left:18px}</style></head><body><p><a href="../monitor.html">Monitor</a></p><h1>Presence Ledger</h1><input id="e" placeholder="Gave an hour / received a gift"><button onclick="const l=JSON.parse(localStorage.getItem('pl')||'[]');l.unshift(e.value);localStorage.setItem('pl',JSON.stringify(l));render()">Log</button><ul id="u"></ul><script>function render(){u.innerHTML=(JSON.parse(localStorage.getItem('pl')||'[]')).map(x=>'<li>'+x+'</li>').join('')}render()</script></body></html>
